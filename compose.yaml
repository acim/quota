services:
  valkey:
    image: valkey/valkey:9.1.1-alpine
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10
    tmpfs:
      - /data
